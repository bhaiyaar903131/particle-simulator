<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Playground</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.9/lib/p5.min.js"></script>
</head>
<body>
  <div class="title">Particle Playground</div>
  <div class="hint">Hold mouse to attract · press R to repel · T for trails</div>
  <div class="mode" id="modeLabel">ATTRACT</div>
  <div class="radius" id="radiusLabel">RADIUS 190</div>
  <section class="controls">
    <label>Particles <span id="countValue">650</span></label>
    <input id="countControl" type="range" min="150" max="1200" step="50" value="650">
    <label>Speed <span id="speedValue">1.0</span></label>
    <input id="speedControl" type="range" min="0.4" max="2.2" step="0.1" value="1">
    <label>Size <span id="sizeValue">1.0</span></label>
    <input id="sizeControl" type="range" min="0.5" max="2.5" step="0.1" value="1">
    <label>Radius <span id="radiusValue">190</span></label>
    <input id="radiusControl" type="range" min="70" max="320" step="10" value="190">
    <label>Force <span id="forceValue">0.16</span></label>
    <input id="forceControl" type="range" min="0.04" max="0.35" step="0.01" value="0.16">
    <div class="buttons">
      <button id="pauseButton">Pause</button>
      <button id="resetButton">Reset</button>
    </div>
    <div class="presets">
      <button data-preset="calm">Calm</button>
      <button data-preset="chaos">Chaos</button>
      <button data-preset="vortex">Vortex</button>
    </div>
  </section>
  <script src="sketch.js"></script>
</body>
</html>
